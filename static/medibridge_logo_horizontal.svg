<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <defs>
    <style>
      <![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap');
      .text-medi { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 72px; fill: #14B8A6; }
      .text-bridge { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 72px; fill: #38BDF8; }
      ]]>
    </style>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14B8A6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Medical Cross -->
    <g transform="translate(60, 60)">
      <rect x="-15" y="-40" width="30" height="80" rx="6" fill="url(#crossGrad)" stroke="#14B8A6" stroke-width="1.5" stroke-opacity="0.3"/>
      <rect x="-40" y="-15" width="80" height="30" rx="6" fill="url(#crossGrad)" stroke="#14B8A6" stroke-width="1.5" stroke-opacity="0.3"/>
    </g>

    <!-- Bridge Curve -->
    <path d="M 15 90 C 35 30, 85 30, 105 90" fill="none" stroke="url(#bridgeGrad)" stroke-width="8" stroke-linecap="round" filter="url(#shadow)"/>
    
    <!-- ECG Heartbeat Line -->
    <path d="M 10 70 L 30 70 L 45 40 L 60 100 L 75 40 L 90 70 L 110 70" fill="none" stroke="#22C55E" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- AI / Circuit Nodes -->
    <circle cx="30" cy="70" r="3.5" fill="#14B8A6"/>
    <circle cx="45" cy="40" r="3.5" fill="#14B8A6"/>
    <circle cx="60" cy="100" r="3.5" fill="#38BDF8"/>
    <circle cx="75" cy="40" r="3.5" fill="#14B8A6"/>
    <circle cx="90" cy="70" r="3.5" fill="#38BDF8"/>
    <circle cx="15" cy="90" r="4" fill="#38BDF8"/>
    <circle cx="105" cy="90" r="4" fill="#14B8A6"/>
  </g>

  <!-- Text Section -->
  <text x="135" y="86">
    <tspan class="text-medi">Medi</tspan><tspan class="text-bridge">Bridge</tspan>
  </text>
</svg>
