{% extends 'base.html' %}

{% block content %}
<style>
  .password-strength-bar {
    width: 0;
    height: 4px;
    margin-top: 5px;
    background-color: #e5e7eb;
    border-radius: 2px;
    transition: width 0.3s, background-color 0.3s;
  }
  .validation-tooltips {
    margin-top: 5px;
    font-size: 12px;
    color: var(--color-text-muted);
  }
  .tooltip {
    display: inline-block;
    margin-right: 5px;
  }
  .password-container {
    position: relative;
  }
  .password-container .eye-icon {
    position: absolute;
    top: 40px;
    right: 12px;
    color: #9ca3af;
    cursor: pointer;
  }
</style>

<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
  <div class="card" style="width: 100%; max-width: 450px;">
    <div class="card-header text-center">
      <img src="../static/medibridge_logo.svg" alt="MediBridge Logo" style="height: 64px; width: 64px; border-radius: 16px; object-fit: contain; margin-bottom: 16px;">
      <h2>Reset Password</h2>
      <p>Enter your email and a new secure password.</p>
    </div>

    <div class="card-body">
      {% if error %}
      <div class="alert alert-error">
        {{ error }}
      </div>
      {% endif %}
      <div id="errorMessage" class="alert alert-error" style="display: none;"></div>

      <form method="POST" action="{{ url_for('forgot_password') }}" onsubmit="return validateForm()">
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-control" required placeholder="name@example.com">
        </div>
        
        <div class="form-group password-container">
          <label for="password" class="form-label">New Password</label>
          <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
          <span class="eye-icon" onclick="togglePasswordVisibility('password')"><i class="fa fa-eye"></i></span>
        </div>
        
        <div class="form-group password-container">
          <label for="confirm_password" class="form-label">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="••••••••">
          <span class="eye-icon" onclick="togglePasswordVisibility('confirm_password')"><i class="fa fa-eye"></i></span>
        </div>

        <div class="password-strength-bar"></div>
        <div class="validation-tooltips">
          <span class="tooltip uppercase-tooltip">• Uppercase</span>
          <span class="tooltip lowercase-tooltip">• Lowercase</span>
          <span class="tooltip digit-tooltip">• Number</span>
          <span class="tooltip specialChar-tooltip">• Special Char</span>
          <span class="tooltip length-tooltip">• 8+ Chars</span>
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-4">Reset Password</button>
      </form>
    </div>

    <div class="card-footer">
      <p class="text-muted" style="margin: 0; font-size: 0.95rem;">Remembered your password? <a href="{{ url_for('login') }}">Sign in</a></p>
    </div>
  </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<script>
  function validateForm() {
    var password = document.getElementById("password").value;
    var confirm_password = document.getElementById("confirm_password").value;
    var errorMessage = document.getElementById("errorMessage");

    if (password !== confirm_password) {
      errorMessage.innerText = "Password mismatch";
      errorMessage.style.display = "block";
      return false;
    }
    var passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
    if (!passwordRegex.test(password)) {
      errorMessage.innerText = "Meet password requirements";
      errorMessage.style.display = "block";
      return false;
    }

    errorMessage.style.display = "none";
    return true;
  }
  
  var passwordInput = document.getElementById("password");
  var passwordStrengthBar = document.querySelector(".password-strength-bar");
  var validationTooltips = document.querySelector(".validation-tooltips");

  if(passwordInput) {
    passwordInput.addEventListener("input", function () {
      var password = this.value;
      var strength = 0;
  
      if (/(?=.*[A-Z])/.test(password)) {
        strength++;
        validationTooltips.querySelector(".uppercase-tooltip").style.color = "var(--color-primary)";
      } else {
        validationTooltips.querySelector(".uppercase-tooltip").style.color = "#6b7280";
      }
  
      if (/(?=.*[a-z])/.test(password)) {
        strength++;
        validationTooltips.querySelector(".lowercase-tooltip").style.color = "var(--color-primary)";
      } else {
        validationTooltips.querySelector(".lowercase-tooltip").style.color = "#6b7280";
      }
  
      if (/(?=.*\d)/.test(password)) {
        strength++;
        validationTooltips.querySelector(".digit-tooltip").style.color = "var(--color-primary)";
      } else {
        validationTooltips.querySelector(".digit-tooltip").style.color = "#6b7280";
      }
  
      if (/(?=.*[!@#$%^&*])/.test(password)) {
        strength++;
        validationTooltips.querySelector(".specialChar-tooltip").style.color = "var(--color-primary)";
      } else {
        validationTooltips.querySelector(".specialChar-tooltip").style.color = "#6b7280";
      }
  
      if (password.length >= 8) {
        strength++;
        validationTooltips.querySelector(".length-tooltip").style.color = "var(--color-primary)";
      } else {
        validationTooltips.querySelector(".length-tooltip").style.color = "#6b7280";
      }
  
      var barWidth = (strength / 5) * 100 + "%";
      passwordStrengthBar.style.width = barWidth;
  
      if (strength === 0) {
        passwordStrengthBar.style.backgroundColor = "#e5e7eb";
      } else if (strength <= 2) {
        passwordStrengthBar.style.backgroundColor = "var(--color-danger)";
      } else if (strength <= 4) {
        passwordStrengthBar.style.backgroundColor = "#f59e0b";
      } else {
        passwordStrengthBar.style.backgroundColor = "var(--color-accent)";
      }
    });
  }

  function togglePasswordVisibility(inputId) {
    var inputElement = document.getElementById(inputId);
    var eyeIcon = inputElement.parentNode.querySelector(".eye-icon");
    if (inputElement.type === "password") {
      inputElement.type = "text";
      eyeIcon.innerHTML = '<i class="fa fa-eye-slash"></i>';
    } else {
      inputElement.type = "password";
      eyeIcon.innerHTML = '<i class="fa fa-eye"></i>';
    }
  }
</script>
{% endblock %}
