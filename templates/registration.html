{% extends 'base.html' %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
  <div class="card" style="width: 100%; max-width: 450px;">
    
    <div class="card-header text-center">
      <img src="../static/medibridge_logo.svg" alt="MediBridge Logo" style="height: 64px; width: 64px; border-radius: 16px; object-fit: contain; margin-bottom: 16px;">
      <h2>Create an Account</h2>
      <p>Join us to manage your health easily.</p>
    </div>

    <div class="card-body">
      {% if error %}
      <div class="alert alert-error">
        {{ error }}
      </div>
      {% endif %}

      <form action="{{ url_for('registration') }}" method="POST">
        {% if next_url %}
        <input type="hidden" name="next" value="{{ next_url }}">
        {% endif %}
        <div class="form-group">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" id="name" name="name" class="form-control" required placeholder="John Doe">
        </div>
        
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-control" required placeholder="name@example.com">
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 15px;">Sign up</button>
      </form>
    </div>

    <div class="card-footer">
      <p class="text-muted" style="margin: 0; font-size: 0.95rem;">Already have an account? <a href="/login">Sign in</a></p>
    </div>
    
  </div>
</div>
{% endblock %}
